<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Senggang Coffe | Tempat Berhenti Sejenak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --cream: #f5edda;
    --yellow: #f2ca45;
    --brown: #5a3827;
    --dark: #211b17;
    --green: #697650;
    --pink: #e9a8a0;
    --white: #fffdf7;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: var(--cream);
    color: var(--dark);
    font-family: "DM Sans", Arial, sans-serif;
}

button, input, textarea, select {
    font: inherit;
}

button, a {
    -webkit-tap-highlight-color: transparent;
}

a {
    color: inherit;
    text-decoration: none;
}

button {
    cursor: pointer;
}

.nav {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: 15px 5%;
    background: var(--cream);
    border-bottom: 2px solid var(--dark);
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: Anton, sans-serif;
    font-size: 23px;
    white-space: nowrap;
}

.brand-mark {
    display: grid;
    place-items: center;
    width: 42px;
    height: 42px;
    border: 2px solid var(--dark);
    border-radius: 50%;
    background: var(--yellow);
    font-size: 19px;
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 18px;
    list-style: none;
}

.nav-links a {
    font-size: 13px;
    font-weight: 700;
    transition: color .2s;
}

.nav-links a:hover,
.nav-links a.active {
    color: #99711b;
}

.nav-actions {
    display: flex;
    align-items: center;
    gap: 10px;
}

.cart-button {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border: 2px solid var(--dark);
    border-radius: 30px;
    background: var(--yellow);
    font-weight: 700;
}

.cart-count {
    display: grid;
    place-items: center;
    width: 23px;
    height: 23px;
    border-radius: 50%;
    background: var(--dark);
    color: white;
}

.menu-toggle {
    display: none;
    padding: 8px 12px;
    border: 2px solid var(--dark);
    background: transparent;
    font-size: 20px;
}

main {
    min-height: 75vh;
}

.container {
    width: min(1160px, 90%);
    margin: auto;
}

.section {
    padding: 55px 0;
}

.eyebrow {
    display: inline-block;
    margin-bottom: 12px;
    padding: 7px 12px;
    border: 1px solid var(--dark);
    border-radius: 30px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.display {
    font-family: Anton, Impact, sans-serif;
    font-weight: 400;
    line-height: 1.04;
    text-transform: uppercase;
    letter-spacing: .3px;
}

h1.display {
    font-size: clamp(44px, 7vw, 86px);
}

h2.display {
    font-size: clamp(35px, 5vw, 58px);
}

h3 {
    font-size: 22px;
}

p {
    line-height: 1.7;
}

.hero {
    display: grid;
    grid-template-columns: 1.1fr .9fr;
    align-items: center;
    gap: 45px;
    padding: 65px 0;
}

.hero p {
    max-width: 500px;
    margin: 22px 0;
    color: #5c5146;
}

.button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px 20px;
    border: 2px solid var(--dark);
    border-radius: 4px;
    background: var(--yellow);
    color: var(--dark);
    font-weight: 700;
    transition: transform .2s, box-shadow .2s;
}

.button:hover {
    transform: translateY(-3px);
    box-shadow: 4px 4px 0 var(--dark);
}

.button.dark {
    background: var(--dark);
    color: white;
}

.button.light {
    background: var(--white);
}

.hero-art {
    position: relative;
    display: grid;
    place-items: center;
    min-height: 390px;
    overflow: hidden;
    border: 2px solid var(--dark);
    border-radius: 48% 48% 8px 8px;
    background: var(--yellow);
}

.sun {
    position: absolute;
    top: 30px;
    right: 30px;
    width: 100px;
    height: 100px;
    border: 2px solid var(--dark);
    border-radius: 50%;
    background: var(--pink);
}

.cup {
    position: relative;
    display: grid;
    place-items: center;
    width: 175px;
    height: 150px;
    margin-top: 35px;
    border: 5px solid var(--dark);
    border-radius: 12px 12px 45px 45px;
    background: var(--white);
    box-shadow: 10px 12px 0 rgba(33,27,23,.12);
    transform: rotate(-7deg);
}

.cup::after {
    position: absolute;
    right: -54px;
    top: 28px;
    width: 48px;
    height: 65px;
    border: 5px solid var(--dark);
    border-left: 0;
    border-radius: 0 30px 30px 0;
    content: "";
}

.cup span {
    font-family: Anton, sans-serif;
    font-size: 28px;
    text-align: center;
    line-height: 1.05;
}

.hero-sticker {
    position: absolute;
    bottom: 24px;
    left: 20px;
    padding: 12px 15px;
    border: 2px solid var(--dark);
    background: var(--pink);
    font-family: Anton, sans-serif;
    font-size: 19px;
    transform: rotate(-7deg);
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin: 20px 0 50px;
}

.stat {
    padding: 23px;
    border: 2px solid var(--dark);
    background: var(--yellow);
}

.stat:nth-child(2) {
    background: var(--pink);
}

.stat:nth-child(3) {
    background: #b9c39d;
}

.stat strong {
    display: block;
    font-family: Anton, sans-serif;
    font-size: 38px;
}

.stat span {
    font-size: 13px;
    font-weight: 600;
}

.section-heading {
    display: flex;
    align-items: end;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 25px;
}

.category-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 17px;
}

.category-card {
    display: flex;
    min-height: 180px;
    flex-direction: column;
    justify-content: space-between;
    padding: 20px;
    border: 2px solid var(--dark);
    background: var(--yellow);
    transition: transform .2s;
}

.category-card:nth-child(2) {
    background: var(--pink);
}

.category-card:nth-child(3) {
    background: #b9c39d;
}

.category-card:nth-child(4) {
    background: #e9d9bd;
}

.category-card:hover {
    transform: translateY(-5px);
}

.category-icon {
    font-size: 36px;
}

.category-card strong {
    font-family: Anton, sans-serif;
    font-size: 24px;
    font-weight: 400;
    text-transform: uppercase;
}

.promo {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 25px;
    margin-top: 55px;
    padding: 35px;
    border: 2px solid var(--dark);
    background: var(--green);
    color: white;
}

.promo p {
    margin-top: 10px;
    color: #f5edda;
}

.promo .button {
    flex-shrink: 0;
}

.page-heading {
    padding: 45px 0 30px;
}

.page-heading p {
    margin-top: 12px;
    color: #65594d;
}

.filters {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 25px;
}

.filter {
    padding: 9px 15px;
    border: 1px solid var(--dark);
    border-radius: 25px;
    background: transparent;
    font-size: 13px;
    font-weight: 700;
}

.filter.active {
    background: var(--dark);
    color: white;
}

.product-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.product {
    overflow: hidden;
    border: 2px solid var(--dark);
    background: var(--white);
}

.product-art {
    position: relative;
    display: grid;
    place-items: center;
    min-height: 210px;
    background: #e9d9bd;
}

.product:nth-child(3n + 2) .product-art {
    background: #f2d8bd;
}

.product:nth-child(3n) .product-art {
    background: #dce0c7;
}

.product-emoji {
    font-size: 83px;
    filter: drop-shadow(3px 5px 0 rgba(33,27,23,.12));
}

.product-label {
    position: absolute;
    top: 12px;
    left: 12px;
    padding: 6px 9px;
    border: 1px solid var(--dark);
    background: var(--yellow);
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
}

.product-body {
    padding: 18px;
}

.product-body h3 {
    font-family: Anton, sans-serif;
    font-size: 23px;
    font-weight: 400;
    text-transform: uppercase;
}

.product-body p {
    min-height: 45px;
    margin: 8px 0 15px;
    color: #716456;
    font-size: 13px;
}

.product-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

.price {
    font-size: 16px;
    font-weight: 700;
}

.add {
    width: 42px;
    height: 42px;
    border: 2px solid var(--dark);
    border-radius: 50%;
    background: var(--yellow);
    font-size: 24px;
    font-weight: 700;
}

.add:hover {
    background: var(--pink);
}

.empty-state {
    grid-column: 1 / -1;
    padding: 35px;
    border: 2px dashed var(--dark);
    text-align: center;
}

.panel {
    padding: 28px;
    border: 2px solid var(--dark);
    background: var(--white);
}

.checkout-layout {
    display: grid;
    grid-template-columns: 1.2fr .8fr;
    gap: 25px;
    align-items: start;
}

.cart-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    gap: 15px;
    padding: 18px 0;
    border-bottom: 1px solid #ddd0b9;
}

.cart-row h3 {
    font-size: 16px;
}

.cart-row small {
    display: block;
    margin-top: 5px;
    color: #756b60;
}

.qty-controls {
    display: flex;
    align-items: center;
    gap: 9px;
}

.qty-controls button {
    width: 28px;
    height: 28px;
    border: 1px solid var(--dark);
    background: var(--cream);
}

.remove {
    border: 0;
    background: transparent;
    color: #a13f32;
    font-size: 12px;
}

.summary-line {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    margin: 15px 0;
}

.summary-line.total {
    padding-top: 15px;
    border-top: 2px solid var(--dark);
    font-size: 20px;
    font-weight: 700;
}

.field {
    display: grid;
    gap: 7px;
    margin: 17px 0;
}

.field label {
    font-size: 13px;
    font-weight: 700;
}

.field input,
.field textarea,
.field select {
    width: 100%;
    padding: 12px;
    border: 1px solid #b4a793;
    border-radius: 3px;
    background: white;
    color: var(--dark);
}

.field textarea {
    min-height: 110px;
    resize: vertical;
}

.payment-methods {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.method {
    padding: 13px;
    border: 1px solid var(--dark);
    background: transparent;
    text-align: left;
}

.method.active {
    background: var(--yellow);
    box-shadow: inset 0 0 0 1px var(--dark);
}

.notice {
    margin-top: 15px;
    padding: 13px;
    background: #eee5d3;
    font-size: 12px;
    line-height: 1.6;
}

.review-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 17px;
    margin-bottom: 35px;
}

.review-card {
    padding: 23px;
    border: 2px solid var(--dark);
    background: var(--white);
}

.stars {
    margin-bottom: 13px;
    color: #b8860b;
    letter-spacing: 3px;
}

.review-card p {
    font-size: 14px;
}

.review-card strong {
    display: block;
    margin-top: 15px;
}

.info-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.info-card {
    padding: 25px;
    border: 2px solid var(--dark);
    background: var(--yellow);
}

.info-card:nth-child(2) {
    background: var(--pink);
}

.info-card:nth-child(3) {
    background: #b9c39d;
}

.info-card:nth-child(4) {
    background: #e9d9bd;
}

.info-card h3 {
    margin-bottom: 10px;
    font-family: Anton, sans-serif;
    font-weight: 400;
    text-transform: uppercase;
}

.login-wrap {
    display: grid;
    place-items: center;
    padding: 65px 0;
}

.login-card {
    width: min(440px, 100%);
}

.login-card .brand-mark {
    margin-bottom: 20px;
}

.footer {
    margin-top: 55px;
    padding: 35px 5%;
    border-top: 2px solid var(--dark);
    background: var(--dark);
    color: var(--cream);
}

.footer-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 25px;
}

.footer p {
    margin-top: 8px;
    color: #c7bba8;
    font-size: 13px;
}

.footer-links {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    font-size: 13px;
}

.toast {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 999;
    max-width: calc(100% - 40px);
    padding: 14px 20px;
    border: 2px solid var(--dark);
    background: var(--yellow);
    font-size: 14px;
    font-weight: 700;
    opacity: 0;
    pointer-events: none;
    transform: translateY(15px);
    transition: .25s;
}

.toast.show {
    opacity: 1;
    transform: translateY(0);
}

.hidden {
    display: none !important;
}

@media (max-width: 1050px) {
    .nav {
        flex-wrap: wrap;
    }

    .nav-links {
        gap: 12px;
    }

    .nav-links a {
        font-size: 12px;
    }

    .category-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 760px) {
    .nav {
        gap: 12px;
        padding: 12px 5%;
    }

    .brand {
        font-size: 20px;
    }

    .menu-toggle {
        display: block;
    }

    .nav-links {
        display: none;
        order: 5;
        width: 100%;
        flex-direction: column;
        align-items: stretch;
        gap: 0;
    }

    .nav.open .nav-links {
        display: flex;
    }

    .nav-links a {
        display: block;
        padding: 12px 0;
        border-top: 1px solid #d8cbb5;
        font-size: 14px;
    }

    .nav-actions {
        margin-left: auto;
    }

    .cart-button {
        padding: 8px 10px;
        font-size: 12px;
    }

    .hero {
        grid-template-columns: 1fr;
        gap: 25px;
        padding: 35px 0;
    }

    .hero-art {
        min-height: 300px;
    }

    .stats {
        gap: 8px;
    }

    .stat {
        padding: 14px 10px;
    }

    .stat strong {
        font-size: 28px;
    }

    .stat span {
        font-size: 11px;
    }

    .product-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
    }

    .product-art {
        min-height: 145px;
    }

    .product-emoji {
        font-size: 60px;
    }

    .product-body {
        padding: 12px;
    }

    .product-body h3 {
        font-size: 18px;
    }

    .product-body p {
        font-size: 12px;
    }

    .product-bottom {
        align-items: end;
    }

    .price {
        font-size: 13px;
    }

    .add {
        width: 35px;
        height: 35px;
    }

    .checkout-layout {
        grid-template-columns: 1fr;
    }

    .review-grid {
        grid-template-columns: 1fr;
    }

    .promo {
        align-items: flex-start;
        flex-direction: column;
        padding: 25px;
    }

    .footer-inner {
        align-items: flex-start;
        flex-direction: column;
    }
}

@media (max-width: 420px) {
    .category-grid,
    .info-grid {
        grid-template-columns: 1fr;
    }

    .category-card {
        min-height: 140px;
    }

    .product-grid {
        grid-template-columns: 1fr;
    }

    .product-art {
        min-height: 200px;
    }

    .product-emoji {
        font-size: 78px;
    }

    .section {
        padding: 35px 0;
    }

    .cart-row {
        grid-template-columns: 1fr auto;
    }

    .cart-row .qty-controls {
        grid-column: 1 / -1;
    }
}
</style>
</head>

const CART_KEY = "senggang_cart_v1";

function getCart() {
    try {
        const value = JSON.parse(localStorage.getItem(CART_KEY) || "[]");
        return Array.isArray(value) ? value : [];
    } catch {
        return [];
    }
}

function saveCart(cart) {
    localStorage.setItem(CART_KEY, JSON.stringify(cart));
    updateCartCount();
}

function formatRupiah(value) {
    return new Intl.NumberFormat("id-ID", {
        style: "currency",
        currency: "IDR",
        maximumFractionDigits: 0
    }).format(value);
}

function cartQuantity() {
    return getCart().reduce((total, item) => total + item.qty, 0);
}

function cartTotal() {
    return getCart().reduce((total, item) => {
        return total + item.price * item.qty;
    }, 0);
}

function updateCartCount() {
    const element = document.getElementById("cartCount");
    if (element) element.textContent = cartQuantity();
}

function addToCart(id) {
    const product = menus.find(item => item.id === Number(id));
    if (!product) return;

    const cart = getCart();
    const existing = cart.find(item => item.id === product.id);

    if (existing) {
        existing.qty += 1;
    } else {
        cart.push({
            id: product.id,
            name: product.name,
            price: product.price,
            qty: 1
        });
    }

    saveCart(cart);
    showToast(product.name + " ditambahkan ke keranjang.");
}

function changeQuantity(id, change) {
    let cart = getCart();
    const item = cart.find(product => product.id === Number(id));

    if (!item) return;

    item.qty += change;
    cart = cart.filter(product => product.qty > 0);

    saveCart(cart);
    renderPage();
}

function removeFromCart(id) {
    const cart = getCart().filter(item => item.id !== Number(id));
    saveCart(cart);
    renderPage();
    showToast("Menu dihapus dari keranjang.");
}

let toastTimer;

function showToast(message) {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.classList.add("show");

    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
        toast.classList.remove("show");
    }, 2500);
}

function getReviews() {
    const defaultReviews = [
        {
            name: "Pengunjung Senggang",
            rating: 5,
            message: "Tempat yang cocok buat istirahat sebentar dan menikmati kopi."
        },
        {

            rating: 4,
            message: "Pilihan menu menarik. Cocok untuk nongkrong bareng teman."
        },
        {
            name: "Teman Senggang",
            rating: 5,
            message: "Suasana santai, paling pas buat melepas penat."
        }
    ];

    try {
        const saved = JSON.parse(localStorage.getItem("senggang_reviews") || "null");
        return Array.isArray(saved) ? saved : defaultReviews;
    } catch {
        return defaultReviews;
    }
}

function saveReview(review) {
    const current = getReviews();

    /* Ganti ulasan contoh setelah pengunjung mulai memberi ulasan sendiri. */
    const reviews = [
        review,
        ...current.filter(item => item.name !== "Pengunjung Senggang"
            && item.name !== "Pecinta Kopi"
            && item.name !== "Teman Senggang")
    ];

    localStorage.setItem("senggang_reviews", JSON.stringify(reviews));
}

function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
    })[character]);
}

============================== */

const app = document.getElementById("app");

function currentPage() {
    const page = location.hash.replace("#", "") || "beranda";

    const allowed = [
        "beranda", "kopi", "non-kopi", "makanan",
        "snack", "info-menu", "bayar", "ulasan", "login"
    ];

    return allowed.includes(page) ? page : "beranda";
}

function renderPage() {
    const page = currentPage();

    switch (page) {
        case "kopi":
        case "non-kopi":
        case "makanan":
        case "snack":
            app.innerHTML = renderMenu(page);
            break;

        case "bayar":
            app.innerHTML = renderCart();
            break;

        case "info-menu":
            app.innerHTML = renderInfo();
            break;

        case "ulasan":
            app.innerHTML = renderReviews();
            break;

        case "login":
            app.innerHTML = renderLogin();
            break;

        default:
            app.innerHTML = renderHome();
    }

    document.querySelectorAll("[data-page]").forEach(link => {
        if (link.classList.contains("nav-links")) return;

        if (link.matches(".nav-links a")) {
            link.classList.toggle("active", link.dataset.page === page);
        }
    });

    updateCartCount();
}

function navigate(page) {
    if (currentPage() === page) {
        renderPage();
    } else {
        location.hash = page;
    }

    document.getElementById("navbar").classList.remove("open");
}

/* ==============================
   EVENT WEBSITE
============================== */


document.addEventListener("click", (event) => {
    const target = event.target;

    if (!(target instanceof Element)) return;

    // 1. Navigasi antarhalaman
    const pageLink = target.closest("[data-page]");

    if (pageLink) {
        event.preventDefault();

        const page = pageLink.dataset.page;

        if (page) {
            navigate(page);
        }

        return;
    }

    // 2. Menambahkan menu ke keranjang
    const addButton = target.closest("[data-add]");

    if (addButton) {
        addToCart(addButton.dataset.add);
        return;
    }

    // 3. Mengubah jumlah pesanan
    const qtyButton = target.closest("[data-qty]");

    if (qtyButton) {
        changeQuantity(
            qtyButton.dataset.qty,
            Number(qtyButton.dataset.change)
        );
        return;
    }

    // 4. Menghapus menu dari keranjang
    const removeButton = target.closest("[data-remove]");

    if (removeButton) {
        removeFromCart(removeButton.dataset.remove);
        return;
    }

    // 5. Memilih metode pembayaran
    const methodButton = target.closest("[data-method]");

    if (methodButton) {
        document.querySelectorAll("[data-method]").forEach(button => {
            button.classList.remove("active");
        });

        methodButton.classList.add("active");
    }
});

document.getElementById("menuToggle").addEventListener("click", () => {
    document.getElementById("navbar").classList.toggle("open");
});

window.addEventListener("hashchange", () => {
    renderPage();
    window.scrollTo({ top: 0, behavior: "smooth" });
});

document.addEventListener("submit", event => {
    if (event.target.id === "reviewForm") {
        event.preventDefault();

        const name = document.getElementById("reviewName").value.trim();
        const rating = Number(document.getElementById("reviewRating").value);
        const message = document.getElementById("reviewMessage").value.trim();

        if (!name || !message || rating < 1 || rating > 5) {
            showToast("Lengkapi formulir ulasan terlebih dahulu.");
            return;
        }

        saveReview({ name, rating, message });
        showToast("Terima kasih! Ulasan tersimpan di browser.");
        renderPage();
        return;
    }

    if (event.target.id === "loginForm") {
        event.preventDefault();
        showToast("Ini adalah demo formulir login, belum terhubung ke akun.");
        return;
    }
});

document.addEventListener("click", event => {
    if (event.target.id !== "payButton") return;

    const cart = getCart();

    if (!cart.length) {
        showToast("Keranjang masih kosong. Pilih menu terlebih dahulu.");
        return;
    }

    const customerName = document.getElementById("customerName").value.trim();

    if (!customerName) {
        document.getElementById("customerName").focus();
        showToast("Masukkan nama pemesan terlebih dahulu.");
        return;
    }

    const selectedMethod = document.querySelector("[data-method].active");
    const method = selectedMethod ? selectedMethod.dataset.method : "Tunai";
    const note = document.getElementById("customerNote").value.trim();

    const order = {
        orderNumber: "SG-" + Date.now().toString().slice(-8),
        customerName,
        note,
        method,
        items: cart,
        total: cartTotal(),
        createdAt: new Date().toISOString()
    };

    /*
      Pesanan demo disimpan secara lokal.
      Tidak ada pembayaran sungguhan atau pengiriman pesanan ke server.
    */
    const orders = JSON.parse(localStorage.getItem("senggang_orders") || "[]");
    orders.push(order);
    localStorage.setItem("senggang_orders", JSON.stringify(orders));

    localStorage.removeItem(CART_KEY);
    updateCartCount();

    app.innerHTML = `
        <section class="container section">
            <div class="panel" style="max-width:650px;margin:auto;text-align:center">
                <div style="font-size:65px">✓</div>
                <span class="eyebrow">Pesanan demo tercatat</span>
                <h1 class="display">Terima kasih!</h1>
                <p style="margin:15px 0">
                    Halo ${escapeHTML(order.customerName)}, pesanan demo kamu
                    berhasil dicatat di browser ini.
                </p>

                <div class="notice" style="text-align:left">
                    <div class="summary-line">
                        <span>Nomor pesanan</span>
                        <strong>${escapeHTML(order.orderNumber)}</strong>
                    </div>
                    <div class="summary-line">
                        <span>Metode pembayaran</span>
                        <strong>${escapeHTML(order.method)}</strong>
                    </div>
                    <div class="summary-line">
                        <span>Total</span>
                        <strong>${formatRupiah(order.total)}</strong>
                    </div>
                    <p>Catatan: ${escapeHTML(order.note || "Tidak ada")}</p>
                </div>

                <p style="margin:15px 0">
                    Ini bukan bukti pembayaran sungguhan.
                    Pesanan belum dikirim ke pihak kedai.
                </p>

                <a class="button" href="#beranda" data-page="beranda">
                    Kembali ke Beranda
                </a>
            </div>
        </section>
    `;

    showToast("Pesanan demo berhasil dicatat.");
    window.scrollTo({ top: 0, behavior: "smooth" });
});

/* ==============================
   INISIALISASI
============================== */

document.getElementById("year").textContent = new Date().getFullYear();

if (!location.hash) {
    history.replaceState(null, "", "#beranda");
}

renderPage();
</script>

</body>
</html>
